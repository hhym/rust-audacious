[package]
name = "audacious-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "audacious-rs"
path = "src/main.rs"

[dependencies]
audcore = { path = "../audcore" }
audplugins = { path = "../audplugins" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip"] }
