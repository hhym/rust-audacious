[package]
name = "audacious-rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "audacious-rs"
path = "src/main.rs"

[dependencies]
audcore = { path = "../audcore" }
audplugins = { path = "../audplugins" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
rodio = { version = "0.20", features = ["symphonia-all"] }
symphonia = { version = "0.5", features = ["all"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
qrcode = "0.14"

[package.metadata.android]
package = "io.github.hhym.audaciousrs"
apk_name = "audacious-rs"
build_targets = ["aarch64-linux-android"]
res = "../../android/res"
manifest = "../../android/AndroidManifest.xml"

# Android 分支：winit 要有 android-native-activity 后端，cpal 走 oboe（不依赖系统 ALSA）
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
